# Template for onboarding a new company. Copy to configs/{company_id}.yaml,
# fill in company.id and company.name — everything else inherits from here
# via config_loader.py's deep-merge (only override what a specific company
# genuinely needs to differ on).
#
# Defaults below follow the tuning rubric worked out from real production
# testing (see README "Design Decisions"):
#   - chunk_size/overlap: 800/100 sits in the "general handbook / policy
#     docs" band — most sections are 1-2 paragraphs, this keeps a section
#     whole without over-fragmenting. Dense technical/API docs should
#     override down to 400-600/60-80; long-form narrative guides up to
#     1000-1500/150-200.
#   - top_k: 8 (not 5) — gives the reranker enough candidates to find the
#     right chunk even when a question spans more than one section.
#   - The reranker's relevance-gap filter (max_score_gap) lives in
#     qa_pipeline.py, not here — it's relative to each query's own top
#     match, not a fixed number, because reranker scores don't sit on a
#     comparable scale across different questions (this replaced an
#     earlier absolute-threshold approach that broke in production).

company:
  id: company_xxx
  name: "Company Name"

sources:
  - type: pdf
    path: ./data/companies/company_xxx/raw_pdfs/
    glob: "*.pdf"

processing:
  chunk_size: 1500
  chunk_overlap: 200
  min_chunk_length: 200
  preserve_code_blocks: true

embedding:
  model: BAAI/bge-small-en-v1.5
  batch_size: 32
  device: cpu

vector_store:
  type: chromadb
  path: ./data/companies/company_xxx/vector_store/
  collection_name: company_xxx_docs
  distance_metric: cosine

retrieval:
  top_k: 8
  rerank_top_k: 5
  use_bm25: true
  use_reranker: true
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2